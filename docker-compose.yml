services:
  web:
    build: .
    expose:
      - "8080"          # Traefik routes ceefax.info here; never map 80/443
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.15.1
    expose:
      - "3000"          # Traefik routes analytics.ceefax.info here
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami-db:/var/lib/postgresql/data   # named volume = survives redeploys, backup-able
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  umami-db:
